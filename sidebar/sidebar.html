<div class="sidebar">
  <div class="sidebar__header">
    <h2 class="sidebar__title">Кімнати чату</h2>
  </div>

  <div class="sidebar__content">
    <div class="sidebar__section">
      <h3 class="sidebar__section-title">Мої кімнати</h3>
      <ul class="sidebar-list" id="rooms-list">
        <li class="sidebar__empty">Завантаження кімнат...</li>
      </ul>
    </div>

    <div class="sidebar__section">
      <h3 class="sidebar__section-title">Створити кімнату</h3>
      <div class="sidebar__create">
        <div class="sidebar__input-group">
          <input 
            id="new-room-name" 
            class="sidebar__input" 
            placeholder="Назва нової кімнати"
            maxlength="50"
          >
          <button id="create-room-btn" class="sidebar__btn sidebar__btn--primary">
            <span>+</span>
          </button>
        </div>
        <p class="sidebar__hint">Натисніть Enter або кнопку для створення</p>
        <div id="new-room-id" class="sidebar__room-id" style="display: none;">
          <strong>ID кімнати:</strong> <span></span>
        </div>
      </div>
    </div>

    <div class="sidebar__section">
      <h3 class="sidebar__section-title">Учасники кімнати</h3>
      <div id="members-block" class="sidebar__members">
        <ul id="members-list" class="sidebar__members-list">
          <li class="sidebar__empty">Оберіть кімнату для перегляду учасників</li>
        </ul>
      </div>
    </div>
  </div>
</div>
