<div class="login">
  <div class="login__header">
    <h2 class="login__title">Matrix Chat</h2>
    <p class="login__subtitle">Авторизація в системі</p>
  </div>

  <div class="login__form" id="login-form">
    <div class="login__input-group">
      <label class="login__label">Matrix ID або логін</label>
      <input id="login-username" class="login__input" placeholder="@user:matrix.org" autocomplete="username" />
    </div>

    <div class="login__input-group">
      <label class="login__label">Пароль</label>
      <input id="login-password" class="login__input" type="password" placeholder="Введіть пароль" autocomplete="current-password" />
    </div>

    <button id="login-submit" class="login__btn login__btn--primary">
      <span>Увійти в систему</span>
    </button>
    <div id="login-error" class="login__error"></div>
  </div>

  <div class="login__panel" id="login-panel" style="display:none">
    <div class="login__user-info">
      <div class="login__user-avatar" id="login-avatar">M</div>
      <h3 class="login__subtitle">Вітаємо в системі!</h3>
      
      <div class="login__meta">
        <div class="login__meta-row">
          <span class="muted">Користувач:</span>
          <span id="login-userid" class="mono"></span>
        </div>
        <div class="login__meta-row">
          <span class="muted">Токен:</span>
          <span id="login-token" class="mono copyable" title="Клікніть для копіювання"></span>
        </div>
      </div>

      <div class="login__room-info">
        <div class="login__meta-row">
          <span class="muted">Поточна кімната:</span>
          <code id="room-id-value" class="mono copyable" title="Клікніть для копіювання">Не обрано</code>
        </div>
        <div id="room-id-copy-msg" class="login__copy-msg"></div>
      </div>
    </div>

    <div class="login__actions">
      <button id="login-copy" class="login__btn login__btn--secondary">
        <span>Копіювати токен</span>
      </button>
      <button id="login-logout" class="login__btn login__btn--secondary">
        <span>Вийти з системи</span>
      </button>
    </div>
    <div id="login-copy-msg" class="login__copy-msg"></div>
  </div>
</div>
