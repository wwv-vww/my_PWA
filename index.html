<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Matrix Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/alpinejs" defer></script>
  <script src="./login/login.js"></script>
  <script src="./sidebar/sidebar.js"></script>
  <link rel="stylesheet" href="./sidebar/sidebar.css">
  <link rel="stylesheet" href="./login/login.css">
  <style>
    body {
      background: #ffffff;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
    }
  </style>
</head>

<body class="flex items-center justify-center">
  <div x-data="chatApp()" class="chat-container flex w-full max-w-5xl">
    <!-- Контейнер для сайдбару--> 
    <div id="sidebar-container"></div>

    <!-- Контейнер для основної області чату -->
    <div class="chat-area p-4 flex flex-col">
      <!-- Контейнер для логіну -->
      <div id="login-container"></div>
    </div>
  </div>

  <script>
    // Завантаження HTML-шаблонів після завантаження DOM
    document.addEventListener('DOMContentLoaded', () => {
      // Завантаження login.html
      fetch('./login/login.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('login-container').innerHTML = html;
        })
        .catch(error => console.error('Error loading login:', error));

      // Завантаження sidebar.html
      fetch('./sidebar/sidebar.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('sidebar-container').innerHTML = html;
        })
        .catch(error => console.error('Error loading sidebar:', error));
    });
  </script>

  <script>
    function chatApp() {
      return {
        username: '',
        password: '',
        accessToken: '',
        userId: '',
        roomId: '',
        joinRoomId: '',
        newRoomName: '',
        newRoomId: '',
        rooms: [],
        messages: [],
        newMessage: '',
        inviteUser: '',
        error: '',
        lastSyncToken: '',
        login,
        createRoom,
        fetchRoomsWithNames,
      }
    }
  </script>
</body>
</html>
