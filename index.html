<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Matrix Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/alpinejs" defer></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

<div x-data="chatApp()" class="bg-white p-6 rounded shadow-md w-96">

  <!-- Форма логіну -->
  <template x-if="!accessToken">
    <div>
      <h2 class="text-xl font-bold mb-4">Вхід у систему</h2>
      <input x-model="username" placeholder="Логін"
             class="border p-2 w-full mb-2 rounded" />
      <input x-model="password" type="password" placeholder="Пароль"
             class="border p-2 w-full mb-2 rounded" />
      <button @click="login()" class="bg-blue-500 text-white p-2 w-full rounded">Увійти</button>
      <p x-text="error" class="text-red-500 mt-2"></p>
    </div>
  </template>

  <!-- Панель після авторизації -->
  <template x-if="accessToken">
    <div class="flex flex-col w-full h-[500px]">
      <h1 class="text-2xl font-bold mb-4">Ви успішно авторизувались. Панель керування</h1>
      
      <!-- User ID -->
      <div class="mb-4 p-4 bg-gray-200 rounded text-sm break-words">
        <span class="font-bold">Ваш Matrix ID:</span>
        <span x-text="userId ? userId : 'Завантаження...'"></span>
      </div>

      <!-- Резюме -->
      <div class="mb-4 p-4 bg-gray-100 rounded shadow-sm text-sm">
        <h2 class="font-bold mb-2">Резюме користувача:</h2>
        <p><strong>Ім'я:</strong> 34_20</p>
        <p><strong>Посада:</strong> Розробник</p>
        <p><strong>Досвід:</strong> Розробка веб-додатків, PWA, AlpineJS, TailwindCSS</p>
        <p><strong>Мета:</strong> Навчання та вдосконалення навичок програмування</p>
      </div>
    </div>
  </template>

</div>

<script>
function chatApp() {
  return {
    username: '',
    password: '',
    userId: '',
    accessToken: '',
    error: '',
    
    async login() {
      try {
        const res = await fetch('https://matrix.org/_matrix/client/r0/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'm.login.password', user: this.username, password: this.password })
        });
        const data = await res.json();
        if(data.access_token) {
          this.accessToken = data.access_token;
          this.userId = data.user_id; 
          this.error = '';
        } else {
          this.error = 'Невірний логін або пароль';
        }
      } catch(e) {
        this.error = 'Помилка під час входу';
        console.error(e);
      }
    }
  }
}
</script>
</body>
</html>
