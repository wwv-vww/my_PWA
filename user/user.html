<!-- user.html -->
<div class="user">
  <div class="user__header">
    <h2 class="user__title">Користувачі</h2>
  </div>

  <div class="user__content">
    <!-- Список участников комнаты -->
    <div class="user__section">
      <h3 class="user__section-title">Учасники кімнати</h3>
      <div class="user__members">
        <div id="members-loading" class="user__loading">
          Завантаження учасників...
        </div>
        <ul id="room-members" class="user__members-list" style="display: none;"></ul>
        <div id="members-empty" class="user__empty" style="display: none;">
          Оберіть кімнату для перегляду учасників
        </div>
      </div>
    </div>

    <!-- Действия с пользователями -->
    <div class="user__section">
      <h3 class="user__section-title">Дії з кімнатою</h3>
      
      <!-- Приглашение пользователя -->
      <div class="user__action-group">
        <div class="user__input-group">
          <label class="user__label">Запросити користувача</label>
          <input 
            id="invite-user" 
            class="user__input" 
            placeholder="@username:matrix.org"
            autocomplete="off"
          >
          <button id="invite-btn" class="user__btn user__btn--primary">
            <span>👋</span>
            <span>Запросити</span>
          </button>
        </div>
      </div>

      <!-- Присоединение к комнате -->
      <div class="user__action-group">
        <div class="user__input-group">
          <label class="user__label">Приєднатися до кімнати</label>
          <input 
            id="join-room-id" 
            class="user__input" 
            placeholder="!roomId:matrix.org"
            autocomplete="off"
          >
          <button id="join-btn" class="user__btn user__btn--secondary">
            <span>🚪</span>
            <span>Приєднатися</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Сообщения об ошибках и успехе -->
    <div id="user-error" class="user__error" style="display: none;"></div>
    <div id="user-success" class="user__success" style="display: none;"></div>
  </div>
</div>
